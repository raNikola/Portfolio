<section class="section about" itemscope itemtype="https://schema.org/Person"
         itemid="https://cv.ranikola.dev/#nikola-randjelovic">
    <meta itemprop="url" content="https://cv.ranikola.dev/">
    <meta id="about-email-meta" itemprop="email" content="">
    <div class="layout-col layout-col--s-12">
        <div class="about__box">
            <div class="about__profile">
                <div class="layout-row about__hero">
                    <div class="layout-col layout-col--s-12 layout-col--m-5 about__media">
                        <picture id="about-picture">
                            <source id="about-image-mobile-source" type="image/webp" media="(max-width: 767px)">
                            <source id="about-image-desktop-source" type="image/webp"
                                    media="(min-width: 768px)">
                            <img id="about-image"
                                 src=""
                                 itemprop="image"
                                 alt=""
                                 width=""
                                 height=""
                                 loading="eager"
                                 decoding="async"
                                 fetchpriority="high">
                        </picture>
                    </div>
                    <div class="layout-col layout-col--s-12 layout-col--m-7 about__content">
                        <div class="about__profile-info">
                            <div class="about__profile-preword"><span
                                    class="light-green text-inverse">Hello</span></div>
                            <h1 id="about-name" class="about__profile-title" itemprop="name"></h1>
                            <h2 id="about-role" class="about__profile-position" itemprop="jobTitle"></h2>
                            <p id="about-summary" class="about__profile-summary"></p>
                        </div>

                        <div id="about-contact" class="about__contact"
                             aria-label="Contact and social links"></div>
                    </div>
                </div>
            </div>
            <div class="about__value-bar light-green">
                <div id="about-value-items" class="layout-row"></div>
            </div>
        </div>
    </div>
    <div class="layout-col layout-col--s-12 intro">
        <div class="layout-row">
            <div class="layout-col layout-col--s-12 layout-col--m-12 justify-align intro__article">
                <p id="about-intro"></p>
                <ul id="about-proof-list" class="intro__proof-list layout-row"
                    aria-label="Product delivery proof points"></ul>
            </div>
            <div class="layout-col layout-col--s-12 layout-col--m-12 light u-center intro__download_cv">
                <a id="about-primary-cta"
                   class="ui-btn ui-btn--lg intro__download_btn"
                   href="">
                    <span class="site-icon intro__download_icon" aria-hidden="true"></span>
                    <span id="about-primary-cta-label">EXPLORE EXPERIENCE</span>
                </a>
            </div>
        </div>
    </div>
</section>

<!-- Build-time prototypes (removed/duplicated by binder) -->
<template data-tpl-root="about">
    <span class="about__contact-item" data-tpl="about-contact-text">
        <span class="site-icon" aria-hidden="true" data-role="about-contact-icon"></span>
        <span data-role="about-contact-label"></span>
    </span>

    <span class="about__contact-item" itemprop="address" itemscope itemtype="https://schema.org/PostalAddress" data-tpl="about-contact-location">
        <span class="site-icon" aria-hidden="true" data-role="about-contact-icon"></span>
        <span data-role="about-contact-location-label">
            <span itemprop="addressCountry" data-role="about-contact-location-country"></span>
            <span data-role="about-contact-location-separator"> / </span>
            <span data-role="about-contact-location-detail"></span>
        </span>
    </span>

    <span class="about__contact-item" data-tpl="about-contact-email">
        <span class="site-icon" aria-hidden="true" data-role="about-contact-icon"></span>
        <a href="#" class="about__contact-email" data-role="about-contact-email-link" data-user="" data-domain="" aria-label="" data-analytics="" itemprop="email">[Show email]</a>
    </span>

    <a class="about__contact-item" href="" itemprop="sameAs" target="_blank" rel="noopener noreferrer" aria-label="" data-analytics="" data-tpl="about-contact-social">
        <span class="site-icon" aria-hidden="true" data-role="about-contact-icon"></span>
        <span data-role="about-contact-label"></span>
    </a>

    <div class="layout-col layout-col--s-12 layout-col--l-4 about__value-col" data-tpl="about-value-item">
        <div class="about__value-item">
            <span class="about__value-icon">
                <span class="site-icon" aria-hidden="true" data-role="about-value-icon"></span>
            </span>
            <div>
                <strong data-role="about-value-title"></strong>
                <span data-role="about-value-description"></span>
            </div>
        </div>
    </div>

    <li class="intro__proof-item layout-col layout-col--s-12 layout-col--l-4" data-tpl="about-proof-item">
        <span class="intro__proof-check">
            <span
                class="site-icon intro__proof-icon"
                style="--site-icon: url('')"
                aria-hidden="true"
                data-role="about-proof-icon">
            </span>
        </span>
        <div class="intro__proof-copy">
            <strong data-role="about-proof-title"></strong>
            <span data-role="about-proof-description"></span>
        </div>
    </li>
</template>
